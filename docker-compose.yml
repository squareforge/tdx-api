name: tdx-workbench

services:
  market-service:
    build:
      context: .
      dockerfile: services/market-service/Dockerfile
    container_name: tdx-workbench-market
    ports:
      - "18081:8081"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
      - PORT=8081
      - MARKET_SYNC_ON_START=true
      - MARKET_HIKYUU_ONLY=${MARKET_HIKYUU_ONLY:-false}
      - MARKET_DATA_DIR=/app/data/database
      - HIKYUU_DATA_SERVICE_URL=http://hikyuu-data-service:8091
    dns:
      - 223.5.5.5
      - 119.29.29.29
      - 8.8.8.8
    networks:
      - stock-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  formula-worker:
    build:
      context: .
      dockerfile: services/formula-worker/Dockerfile
    container_name: tdx-workbench-formula
    ports:
      - "18712:8712"
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
      - FORMULA_WORKER_HOST=0.0.0.0
      - FORMULA_WORKER_PORT=8712
      - FORMULA_WORKER_USE_HQCHARTPY2=1
    networks:
      - stock-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "-O", "/dev/null", "http://localhost:8712/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  hikyuu-data-service:
    build:
      context: .
      dockerfile: services/hikyuu-data-service/Dockerfile
    container_name: tdx-workbench-hikyuu-data
    ports:
      - "18091:8091"
    volumes:
      - ./data/hikyuu/stocks:/root/stocks
      - ./data/hikyuu/config:/root/.hikyuu
      - ./data/hikyuu/logs:/app/logs
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
      - PORT=8091
      - HIKYUU_STOCKS_DIR=/root/stocks
      - HIKYUU_CONFIG_DIR=/root/.hikyuu
      - HIKYUU_LOG_DIR=/app/logs
      - HIKYUU_SCHEDULER_ENABLED=false
      - HIKYUU_AFTER_CLOSE_CRON=0 17 * * 1-5
      - HIKYUU_IMPORT_MAX_ATTEMPTS=3
      - HIKYUU_IMPORT_RETRY_DELAY_SECONDS=5
      - HIKYUU_INDICATOR_CACHE_SECONDS=60
      - HIKYUU_MAX_CONCURRENT_QUERIES=4
    dns:
      - 223.5.5.5
      - 119.29.29.29
      - 8.8.8.8
    networks:
      - stock-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "-O", "/dev/null", "http://localhost:8091/api/hikyuu/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 20s

  selection-worker:
    build:
      context: .
      dockerfile: services/selection-worker/Dockerfile
    container_name: tdx-workbench-selection
    ports:
      - "18082:8082"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
      - PORT=8082
      - FORMULA_WORKER_URL=http://formula-worker:8712
      - MARKET_SERVICE_URL=http://market-service:8081
      - SELECTION_MARKET_FALLBACK_DIRECT=false
      - AUTOMATION_SCHEDULER_ENABLED=true
      - SELECTION_QUOTE_MONITOR_ENABLED=true
      - STRATEGY_MAX_CODES=5000
      - STRATEGY_KLINE_BATCH_CONCURRENCY=4
    dns:
      - 223.5.5.5
      - 119.29.29.29
      - 8.8.8.8
    networks:
      - stock-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8082/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  ai-service:
    build:
      context: .
      dockerfile: services/ai-service/Dockerfile
    container_name: tdx-workbench-ai
    ports:
      - "18083:8083"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
      - PORT=8083
      - MARKET_SERVICE_URL=http://market-service:8081
      - HIKYUU_DATA_SERVICE_URL=http://hikyuu-data-service:8091
      - AI_SERVICE_TOKEN=${AI_SERVICE_TOKEN:-}
      - AUTOMATION_SCHEDULER_ENABLED=false
      - AI_CREDENTIAL_SECRET=${AI_CREDENTIAL_SECRET:-tdx-workbench-local-ai-credential-secret}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
    dns:
      - 223.5.5.5
      - 119.29.29.29
      - 8.8.8.8
    networks:
      - stock-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8083/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  stock-web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: tdx-workbench-web
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
      - TDX_APP_ROLE=web
      - PORT=8080
      - MARKET_SERVICE_URL=http://market-service:8081
      - HIKYUU_DATA_SERVICE_URL=http://hikyuu-data-service:8091
      - AI_SERVICE_URL=http://ai-service:8083
      - AI_SERVICE_TOKEN=${AI_SERVICE_TOKEN:-}
      - FORMULA_WORKER_URL=http://formula-worker:8712
      - SELECTION_WORKER_URL=http://selection-worker:8082
      - AUTOMATION_SCHEDULER_ENABLED=false
    dns:
      - 223.5.5.5
      - 119.29.29.29
      - 8.8.8.8
    networks:
      - stock-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    labels:
      - "com.stock.description=TDX Workbench"
      - "com.stock.version=0.1.3-beta.1"

networks:
  stock-network:
    driver: bridge
